    <path d="M7 15a5 5 0 0 1 5-5h7a5 5 0 0 1 10 0h7a5 5 0 0 1 5 5v21a5 5 0 0 1-5 5H12a5 5 0 0 1-5-5z" fill="#4C97FF" stroke="#1B1B3A" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="26,16 17,27 23,27 20,37 31,24 25,24" fill="#FFD60A" stroke="#1B1B3A" stroke-width="2.5" stroke-linejoin="round"/>
  </svg>
  <text x="58" y="38" font-family="Nunito, 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif" font-size="32" font-weight="800" textLength="186" lengthAdjust="spacingAndGlyphs"><tspan fill="#1B1B3A">Bolt</tspan><tspan fill="#2F6FD6">Blocks</tspan></text>
