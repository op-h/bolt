<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 56" width="250" height="56" role="img" aria-labelledby="bb-logo-title">
  <title id="bb-logo-title">BoltBlocks</title>
  <!-- For light backgrounds. "Bolt" is ink #1B1B3A (16.6:1 on white), "Blocks" is #2F6FD6 (4.81:1 on white).
       textLength pins the wordmark width so fallback fonts cannot reflow it. In the app header, use live text + logo-mark instead. -->
